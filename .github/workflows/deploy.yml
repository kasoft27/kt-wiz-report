name: Auto Update & Deploy KT Wiz Report

on:
  schedule:
    # 매일 한국 시간(KST) 오전 3:00 (UTC 18:00)에 자동 실행
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼으로 수동 즉시 실행 가능
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run KT Wiz Report Generator
        run: |
          python update_report.py

      - name: Commit and push updated index.html if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "자동 갱신: KT 위즈 최신 경기 결과 및 순위 업데이트" || echo "변경 사항 없음"
          git push || echo "푸시 건너뜀"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
